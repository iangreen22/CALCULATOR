<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="app">
        <div class="h-screen flex justify-center items-center">
            <div
                class="h-130 w-80 bg-[url('cal.png')] bg-cover bg-center border-2 border-zinc-300 rounded-xl shadow-xl shadow-zinc-900 flex flex-col justify-between px-3 py-3">

                <div class="flex justify-center">
                    <h1 class="text-center font-bold italic text-shadow-lg bg-white w-25 ">V U E</h1>
                </div>

                <div class="h-25 flex justify-end items-center bg-black px-2 my-5 rounded-xl">
                    <input v-model="display" class="text-5xl text-lime-400 font-mono outline-none w-full text-end"
                        type="text">
                </div>
                <div class="h-85 flex justify-center items-center">
                    <div class=" h-full w-70 grid grid-cols-4 ">
                        <!-- first row -->
                        <div class="flex items-center justify-center">
                            <button @click="removeInput()"
                                class="border-2 border-yellow-500 bg-yellow-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-yellow-500">AC</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="onOff()"
                                class="border-2 border-yellow-500 bg-yellow-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-yellow-500">OFF</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressOptr('%')"
                                class="border-2 border-yellow-500 bg-yellow-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-bold cursor-pointer hover:bg-yellow-500">%</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressOptr('/')"
                                class=" bg-orange-400 h-15 w-15 rounded-full flex justify-center items-center text-2xl font-bold cursor-pointer hover:bg-orange-500">÷</button>
                        </div>

                        <!-- 2nd row -->
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('7')"
                                class=" border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">7</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('8')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">8</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('9')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">9</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressOptr('*')"
                                class="border-2 border-orange-500 bg-orange-400 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-orange-500">x</button>
                        </div>

                        <!-- 3rd row -->
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('4')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">4</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('5')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">5</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('6')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">6</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressOptr('-')"
                                class="border-2 border-orange-500 bg-orange-400 h-15 w-15 rounded-full flex justify-center items-center text-3xl font-bold cursor-pointer hover:bg-orange-500">-</button>
                        </div>

                        <!-- 4th row -->
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('1')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">1</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('2')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">2</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('3')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">3</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressOptr('+')"
                                class="border-2 border-orange-500 bg-orange-400 h-15 w-15 rounded-full flex justify-center items-center text-2xl font-bold cursor-pointer hover:bg-orange-500">+</button>
                        </div>
                        <!-- last row -->
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('.')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400">.</button>
                        </div>
                        <div class="flex items-center justify-center">
                            <button @click="pressNumber('0')"
                                class="border-2 border-zinc-400 bg-zinc-300 h-15 w-15 rounded-full flex justify-center items-center text-xl font-semibold cursor-pointer hover:bg-zinc-400 ">0</button>
                        </div>
                        <div class="grid col-span-2">
                            <div class="flex items-center justify-center">
                                <button @click="calculate()"
                                    class="border-2 border-orange-500 bg-orange-400  h-15 w-33 rounded-full flex justify-center items-center text-2xl font-bold cursor-pointer hover:bg-orange-500 ">=</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>


    <script>
        Vue.createApp({
            data() {
                return {
                    numberInput: '',
                    operatorInput: '',
                    display: '',
                    firstValue: 0,

                }


            },
            methods: {
                pressNumber(value) {
                    this.numberInput += value;
                    this.display = this.numberInput;
                },
                pressOptr(mdas) {

                    if (this.operatorInput === "" && this.numberInput !== "") {
                        this.firstValue = parseFloat(this.numberInput);
                    } else {
                        this.equalOutput();
                    }

                    this.operatorInput = mdas;
                    this.numberInput = '';
                    this.display = this.firstValue;

                },
                equalOutput() {
                    let secondValue = parseFloat(this.numberInput);

                    if (isNaN(secondValue)) {
                        return true;
                    }

                    if (this.operatorInput === "/" && secondValue === 0) {
                        this.display = "error";
                    }

                    if (secondValue) {
                        switch (this.operatorInput) {
                            case "+":
                                this.firstValue = this.firstValue + secondValue;
                                break;

                            case "-":
                                this.firstValue = this.firstValue - secondValue;
                                break;

                            case "*":
                                this.firstValue = this.firstValue * secondValue;
                                break;

                            case "/":
                                this.firstValue = this.firstValue / secondValue;
                                break;

                            default:
                                this.firstValue = secondValue;

                        }
                        this.numberInput = '';
                        this.display = this.firstValue;
                        return;
                    }
                },
                calculate() {
                    let success = this.equalOutput();
                    if (!success) {
                        return;
                    }
                    this.operatorInput = '';
                },
                removeInput() {
                    this.numberInput = '';
                    this.display = "0";

                    this.firstValue = 0;
                    this.operatorInput = '';
                },
                onOff(){
                    this.display= 'POWER OFF';
                },

            },

        }).mount("#app");

    </script>
</body>

</html>
